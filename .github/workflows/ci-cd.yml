name: CI/CD · ADM e API

on:
  push:
    branches:
      - develop
      - release
      - main
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - release
      - main

permissions:
  contents: read

concurrency:
  group: adm-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/feature/') || github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build e testes
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: amendoas_test
          MARIADB_USER: amendoas_test
          MARIADB_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Executar testes com MariaDB
        env:
          TEST_DATABASE_URL: mariadb://amendoas_test:ci-test-password@127.0.0.1:3306/amendoas_test
        run: npm test

  build-image:
    name: Publicar imagem Docker (GHCR)
    needs: ci
    if: >-
      github.event_name == 'push' &&
      ((github.ref == 'refs/heads/develop' && vars.DEPLOY_DEVELOPMENT == 'true') ||
       (github.ref == 'refs/heads/release' && vars.DEPLOY_HOMOLOGATION == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest_ref: ${{ steps.meta.outputs.image_digest_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Definir tags
        id: tags
        run: |
          IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::12}"
          ENV_TAG=$([ "${GITHUB_REF}" = "refs/heads/release" ] && echo "hml" || echo "dsv")
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:sha-${SHORT_SHA},${IMAGE}:${ENV_TAG}" >> "$GITHUB_OUTPUT"
      - name: Build e push da imagem
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Registrar referência imutável
        id: meta
        run: echo "image_digest_ref=${{ steps.tags.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy-dsv:
    name: Implantar em DSV
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://amendoas-adm-dsv.homologacao-app.com.br
    permissions:
      contents: read
      packages: read
    steps:
      - name: Implantar imagem na VPS (DSV · porta 4000)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          IMAGE_REF: ${{ needs.build-image.outputs.image_digest_ref }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s:%s\n' "$GHCR_ACTOR" "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "sudo /usr/local/sbin/amendoas-deploy-adm dsv ${IMAGE_REF}"

  deploy-hml:
    name: Implantar em Homologação (HML)
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment:
      name: homologation
      url: https://amendoas-adm-hml.homologacao-app.com.br
    permissions:
      contents: read
      packages: read
    steps:
      - name: Implantar imagem na VPS (HML · porta 3000)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          IMAGE_REF: ${{ needs.build-image.outputs.image_digest_ref }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s:%s\n' "$GHCR_ACTOR" "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "sudo /usr/local/sbin/amendoas-deploy-adm hml ${IMAGE_REF}"

  promote-prd:
    name: Promover imagem homologada para Produção
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Localizar imagem validada em homologação (sem recompilar)
        id: resolve
        run: |
          IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          CANDIDATES=("${GITHUB_SHA::12}")
          if PARENT2=$(git rev-parse --verify HEAD^2 2>/dev/null); then
            CANDIDATES+=("${PARENT2::12}")
          fi
          FOUND=""
          for sha in "${CANDIDATES[@]}"; do
            if docker buildx imagetools inspect "${IMAGE}:sha-${sha}" >/dev/null 2>&1; then
              DIGEST=$(docker buildx imagetools inspect "${IMAGE}:sha-${sha}" --format '{{json .Manifest.Digest}}' | tr -d '"')
              FOUND="${IMAGE}@${DIGEST}"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "Nenhuma imagem homologada encontrada no GHCR para ${CANDIDATES[*]}. Promova sempre a partir da branch release." >&2
            exit 1
          fi
          docker buildx imagetools create -t "${IMAGE}:prd" "$FOUND"
          echo "image_digest_ref=${FOUND}" >> "$GITHUB_OUTPUT"
          echo "Imagem homologada promovida como ${IMAGE}:prd (${FOUND})."
      - name: Implantar na VPS de Produção (quando provisionada)
        env:
          PRD_VPS_HOST: ${{ secrets.PRD_VPS_HOST }}
          PRD_VPS_USER: ${{ secrets.PRD_VPS_USER }}
          PRD_VPS_SSH_KEY: ${{ secrets.PRD_VPS_SSH_KEY }}
          PRD_VPS_HOST_KEY: ${{ secrets.PRD_VPS_HOST_KEY }}
          IMAGE_REF: ${{ steps.resolve.outputs.image_digest_ref }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$PRD_VPS_HOST" ]; then
            echo "Servidor de produção ainda não provisionado (secret PRD_VPS_HOST ausente). Imagem promovida e pronta no GHCR: ${IMAGE_REF}"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRD_VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$PRD_VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s:%s\n' "$GHCR_ACTOR" "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "${PRD_VPS_USER}@${PRD_VPS_HOST}" \
              "sudo /usr/local/sbin/amendoas-deploy-adm prd ${IMAGE_REF}"
